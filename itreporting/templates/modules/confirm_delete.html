{% extends 'itreporting/base.html' %}

{% block title %}Delete Module | Ardent Horizon University{% endblock %}

{% block content %}

<style>
    .delete-page {
        min-height: 65vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1rem;
    }

    .delete-card {
        width: 100%;
        max-width: 540px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        padding: 2.5rem;
        text-align: center;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.06);
    }

    .delete-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #fef2f2;
        color: #dc3545;
        font-size: 1.7rem;
    }

    .delete-card h1 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 0.75rem;
    }

    .delete-message {
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 0.5rem;
    }

    .module-name {
        color: #1f2937;
        font-weight: 600;
    }

    .delete-warning {
        color: #9ca3af;
        font-size: 0.9rem;
        margin-bottom: 2rem;
    }

    .delete-actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
    }

    .delete-actions .btn {
        min-width: 120px;
        padding: 0.65rem 1.25rem;
        border-radius: 0.55rem;
        font-weight: 500;
    }

    @media (max-width: 575.98px) {
        .delete-page {
            padding: 2rem 0;
            min-height: 60vh;
        }

        .delete-card {
            padding: 2rem 1.25rem;
        }

        .delete-actions {
            flex-direction: column-reverse;
        }

        .delete-actions .btn {
            width: 100%;
        }
    }
</style>


<section class="delete-page">

    <div class="delete-card">

        <!-- Warning icon -->
        <div class="delete-icon">
            <i class="bi bi-trash3"></i>
        </div>

        <!-- Heading -->
        <h1>Delete Module?</h1>

        <!-- Confirmation message -->
        <p class="delete-message">
            Are you sure you want to delete
            <span class="module-name">"{{ module.name }}"</span>?
        </p>

        <p class="delete-warning">
            This action cannot be undone.
        </p>

        <!-- Actions -->
        <form method="post">
            {% csrf_token %}

            <div class="delete-actions">

                <a
                    href="{% url 'itreporting:module_list' %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    <i class="bi bi-trash3 me-1"></i>
                    Delete Module
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
